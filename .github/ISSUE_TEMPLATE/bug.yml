name: Bug Report
description: File a bug report for wb-flow
body:
  - type: textarea
    id: bug_description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: wb-flow version
      description: The version you are running.
    validations:
      required: true
